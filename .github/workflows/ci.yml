name: DevShowcase CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - name: Validate JavaScript
        shell: bash
        run: find api -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate frontend JavaScript
        run: node --check src/app.js
      - name: Validate JSON configuration
        run: node -e "for (const f of ['package.json','manifest.webmanifest','vercel.json']) JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('JSON OK')"
      - name: Validate required files
        run: |
          test -f index.html
          test -f schema.sql
          test -f manifest.webmanifest
          test -f sw.js
